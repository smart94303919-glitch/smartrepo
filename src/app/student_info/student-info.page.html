<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goBack()" aria-label="Back to student dashboard">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Edit Student Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline" pullingText="Pull down to refresh" refreshingSpinner="circles" refreshingText="Refreshing data..."></ion-refresher-content>
  </ion-refresher>
  <div class="form-scroll-area">
    <main class="profile-page">
      <div class="edit-heading">
        <div>
          <p class="eyebrow">MANAGE RECORD</p>
          <h2>Edit student details</h2>
        </div>
      </div>

    <form (ngSubmit)="confirmSaveChanges()" class="student-form">
      <ion-card class="form-card">
        <ion-card-content>
          <ion-list lines="none">
            <ion-item class="form-field">
              <ion-label position="stacked">Student ID</ion-label>
              <ion-input [(ngModel)]="student.student_id" name="student_id" required></ion-input>
            </ion-item>

            <ion-item class="form-field">
              <ion-label position="stacked">Last Name</ion-label>
              <ion-input
                [(ngModel)]="student.last_name"
                name="last_name"
                required
                (ionInput)="onNameInput('last_name', $event)"
              ></ion-input>
            </ion-item>

            <ion-item class="form-field">
              <ion-label position="stacked">First Name</ion-label>
              <ion-input
                [(ngModel)]="student.first_name"
                name="first_name"
                required
                (ionInput)="onNameInput('first_name', $event)"
              ></ion-input>
            </ion-item>

            <ion-item class="form-field">
              <ion-label position="stacked">Middle Name</ion-label>
              <ion-input
                [(ngModel)]="student.middle_name"
                name="middle_name"
                (ionInput)="onNameInput('middle_name', $event)"
              ></ion-input>
            </ion-item>

            <ion-item class="form-field">
              <ion-label position="stacked">Age</ion-label>
              <ion-input
                type="number"
                [(ngModel)]="student.age"
                name="age"
                maxlength="2"
                required
                (ionInput)="onAgeInput($event)"
              ></ion-input>
            </ion-item>

            <ion-item class="form-field">
              <ion-label position="stacked">Sex</ion-label>
              <ion-select [(ngModel)]="student.gender" name="gender" interface="popover" required>
                <ion-select-option value="Male">Male</ion-select-option>
                <ion-select-option value="Female">Female</ion-select-option>
              </ion-select>
            </ion-item>

            <ion-item class="form-field">
              <ion-label position="stacked">Section</ion-label>
              <ion-select [(ngModel)]="student.section" name="section" interface="popover" (ionChange)="onSectionChange()" required>
                <ion-select-option *ngFor="let section of sections" [value]="section.section">
                  {{ section.section }}
                </ion-select-option>
              </ion-select>
            </ion-item>

            <ion-item class="form-field">
              <ion-label position="stacked">Subjects</ion-label>
              <ion-select
                [(ngModel)]="selectedSubjectIds"
                name="subjects"
                interface="popover"
                [multiple]="true"
                (ionChange)="onSubjectChange($event)"
                required
              >
                <ion-select-option *ngFor="let subject of subjects" [value]="subject.SubjectID">
                  {{ subject.subject }}
                </ion-select-option>
              </ion-select>
            </ion-item>
          </ion-list>

          <ion-button expand="block" type="submit" class="save-button">
            <ion-icon slot="start" name="save-outline"></ion-icon>
            Save Changes
          </ion-button>
        </ion-card-content>
      </ion-card>
    </form>
    </main>
  </div>
</ion-content>
