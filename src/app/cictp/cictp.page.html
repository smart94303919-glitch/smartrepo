<ion-header [translucent]="true">
  <ion-toolbar>

    <!-- Back Icon -->
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="onGoto()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline" pullingText="Pull down to refresh" refreshingSpinner="circles" refreshingText="Refreshing data..."></ion-refresher-content>
  </ion-refresher>

  <!-- Title -->
  <div class="page-title">
    <h1>CICT Department</h1>
  </div>

  <!-- Existing Buttons (do not change) -->
  <div class="button-grid">
    <ion-button expand="block" (click)="onGogo()">1st Year</ion-button>
    <ion-button expand="block" (click)="onGege()">2nd Year</ion-button>
    <ion-button expand="block" (click)="onGigi()">3rd Year</ion-button>
    <ion-button expand="block" (click)="onGego()">4th Year</ion-button>
  </div>

</ion-content>
