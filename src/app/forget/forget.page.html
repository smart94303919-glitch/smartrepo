<!-- forgot.page.html -->
<ion-content class="ion-text-center ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline" pullingText="Pull down to refresh" refreshingSpinner="circles" refreshingText="Refreshing data..."></ion-refresher-content>
  </ion-refresher>
  <div class="box">
    <h2>Forgot Password</h2>

    <!-- Message placeholder -->
    <div class="msg">[Message goes here]</div>

    <!-- STEP 1: Send OTP -->
    <form>
      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <ion-input type="email" placeholder="Enter your email"></ion-input>
      </ion-item>
      <ion-button expand="block" color="primary">Send OTP</ion-button>
    </form>

    <!-- STEP 2: Reset Password (UI only) -->
    <form>
      <ion-item>
        <ion-label position="stacked">OTP</ion-label>
        <ion-input type="text" placeholder="Enter OTP"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">New Password</ion-label>
        <ion-input type="password" placeholder="New Password"></ion-input>
      </ion-item>
      <ion-button expand="block" color="primary">Reset Password</ion-button>
    </form>

    <!-- Link -->
    <ion-button fill="clear" color="medium" routerLink="/login">Start Over</ion-button>
  </div>
</ion-content>
