<!-- index.page.html -->
<ion-content class="ion-text-center ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline" pullingText="Pull down to refresh" refreshingSpinner="circles" refreshingText="Refreshing data..."></ion-refresher-content>
  </ion-refresher>
  <!-- Logo -->
  <ion-img src="assets/SMART.png" alt="SMART" class="logo"></ion-img>

  <div class="login-container">
    <form [formGroup]="loginForm" (ngSubmit)="onEnter()">
      <ion-item [class.error]="isFieldInvalid('prof_number')">
        <ion-label position="stacked">PROFESSOR NUMBER:</ion-label>
        <ion-input type="text" formControlName="prof_number" [disabled]="isLockedOut"></ion-input>
      </ion-item>
      <div class="error-text" *ngIf="isFieldInvalid('prof_number')">
        {{ getFieldError('prof_number') }}
      </div>

      <ion-item [class.error]="isFieldInvalid('password')">
        <ion-label position="stacked">PASSWORD:</ion-label>
        <ion-input [type]="showPassword ? 'text' : 'password'" formControlName="password" [disabled]="isLockedOut"></ion-input>
        <ion-button
          type="button"
          fill="clear"
          slot="end"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </ion-button>
      </ion-item>
      <div class="error-text" *ngIf="isFieldInvalid('password')">
        {{ getFieldError('password') }}
      </div>
      

      <div class="buttons">
        <ion-button type="submit" color="primary" [disabled]="isLockedOut || loginForm.invalid || isSubmitting">
          <span *ngIf="!isSubmitting">LOGIN</span>
          <span *ngIf="isSubmitting">LOGGING IN...</span>
        </ion-button>
      </div>

      <div *ngIf="isLockedOut" class="lockout-banner">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <div class="lockout-text">
          <h3>Account Temporarily Locked</h3>
          <p>Too many failed attempts. Please try again in:</p>
          <div class="timer-display">{{ formattedLockoutTime }}</div>
        </div>
      </div>
    </form>
  </div>
</ion-content>
