<!-- index.page.html -->
<ion-content class="ion-text-center ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline" pullingText="Pull down to refresh" refreshingSpinner="circles" refreshingText="Refreshing data..."></ion-refresher-content>
  </ion-refresher>
  <!-- Logo -->
  <ion-img src="assets/SMART.png" alt="SMART" class="logo"></ion-img>

  <div class="login-container">
    <form [formGroup]="loginForm" (ngSubmit)="onEnter()">
      <ion-item [class.error]="isFieldInvalid('prof_number')">
        <ion-label position="stacked">PROFESSOR NUMBER:</ion-label>
        <ion-input type="text" formControlName="prof_number"></ion-input>
      </ion-item>
      <div class="error-text" *ngIf="isFieldInvalid('prof_number')">
        {{ getFieldError('prof_number') }}
      </div>

      <ion-item [class.error]="isFieldInvalid('password')">
        <ion-label position="stacked">PASSWORD:</ion-label>
        <ion-input type="password" formControlName="password"></ion-input>
      </ion-item>
      <div class="error-text" *ngIf="isFieldInvalid('password')">
        {{ getFieldError('password') }}
      </div>
      

      <div class="buttons">
        <ion-button type="submit" color="primary" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">LOGIN</span>
          <span *ngIf="isSubmitting">LOGGING IN...</span>
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
